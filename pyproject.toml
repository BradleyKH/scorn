[project]
name = "scorn"
version = "0.1.0"
description = "Proof of concept: PDF sheet music to MusicXML with local OMR engines"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Bradley Harris", email = "bradleykh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "verovio>=6.3.0",
]

[project.scripts]
scorn = "scorn.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
# Drops onnxruntime from the whole resolution. homr pins the CPU build, which clashes with
# onnxruntime-gpu, and pymupdf 2.0 requires it, so without this the core install carries it too.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]
# nvidia-cublas ships Linux wheels only for some versions; resolve for this machine.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
default-groups = ["dev", "eval", "homr"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
eval = [
    "music21>=10.5.2",
]
homr = [
    "homr>=0.7.0",
    "onnxruntime-gpu[cuda,cudnn]>=1.31",
]
